name: Watchdog

# Last-resort safety net. The renewer normally chains every session within
# ~30 seconds of the previous one dying. This only matters if the renewer
# itself failed (dispatch error, quota, repo setting changed).
#
# Runs every 30 minutes.
#
# IMPORTANT: GitHub silently ignores `workflow_id` when it is a workflow file
# NAME - the API returns every workflow's runs. Always filter on
# `name === 'Desktop'` in JavaScript, never on a server side workflow_id.

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restart the chain if nothing is running
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 30
            });

            // Filter by workflow NAME, not by a server side workflow_id.
            const desktops = data.workflow_runs.filter(r => r.name === 'Desktop');
            const live = desktops.filter(
              r => r.status === 'in_progress' || r.status === 'queued');

            if (live.length > 0) {
              core.info('Chain is healthy, live Desktop session(s): ' +
                live.map(r => r.run_number).join(', '));
              return;
            }

            // Do not fire if a session was started moments ago - it may still
            // be in the queue and about to register as in_progress.
            const recent = desktops.filter(
              r => (Date.now() - new Date(r.run_started_at || r.created_at)) < 5 * 60 * 1000);
            if (recent.length > 0) {
              core.info('A Desktop session started moments ago and is probably still starting. Waiting.');
              return;
            }

            core.info('NO live Desktop session. Restarting the chain.');

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'desktop.yml',
                  ref: context.ref,
                  inputs: { 'keep-alive': 'true' }
                });
                core.info('Chain restarted with keep-alive=true (attempt ' + attempt + ').');
                return;
              } catch (e) {
                core.warning('dispatch attempt ' + attempt + ' failed: ' + e.message);
                await sleep(15000);
              }
            }
            core.setFailed('Could not restart the chain.');

      - name: Report
        if: always()
        run: echo "watchdog checked at ${{ github.run_started_at }}" >> "$GITHUB_STEP_SUMMARY"
