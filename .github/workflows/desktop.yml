name: Desktop

on:
  # dispatch-only: a stray push cannot (re)start a desktop session
  workflow_dispatch:
    inputs:
      keep-alive:
        description: 'Keep the 6-hour chain running (uncheck to stop after this session)'
        type: boolean
        default: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    # 330 not 360: leave a 30 minute cushion so the final steps actually run.
    timeout-minutes: 330
    permissions:
      actions: write
      contents: read
    env:
      UID_NUM: '911'
      GID_NUM: '911'
    steps:
      - name: Restore saved state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-boot
          restore-keys: |
            webtop-state-

      - name: Clean old cache entries
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const list = data.actions_caches.sort((a, b) =>
              new Date(b.last_accessed_at) - new Date(a.last_accessed_at));
            for (const c of list.slice(12)) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner, repo: context.repo.repo, cache_id: c.id
              });
            }
            core.info('caches: kept ' + Math.min(12, list.length) + ', deleted ' + Math.max(0, list.length - 12));

      - name: Start Docker
        run: |
          mkdir -p config
          {
            echo "=== THIS RUN: ${{ github.run_id }} ==="
            echo "KEEP-ALIVE: ${{ inputs.keep-alive }}"
            if [ -f state/config.tar.gz ]; then
              tar xzf state/config.tar.gz -C config --no-same-owner
              rm -rf config/.dbus config/.pulse config/.config/pulse config/.cache config/.XDG config/.ICEauthority
              find config -name '*.lock' -delete 2>/dev/null || true
              sudo chown -R "$UID_NUM:$GID_NUM" config
              sudo chmod -R u+rwX config
              echo "STATE: RESTORED ($(find config -type f | wc -l) files)"
              echo "MARKER-FROM-PREV-RUN: $(cat config/.session-marker 2>/dev/null || echo NONE)"
              echo "DESKTOP-FROM-PREV-RUN: $(tr '\n' ' ' < state/desktop.txt 2>/dev/null || echo NONE)"
            else
              echo "STATE: FRESH (brand new - nothing saved before)"
              echo "MARKER-FROM-PREV-RUN: NONE"
              echo "DESKTOP-FROM-PREV-RUN: NONE"
            fi
          } | tee /tmp/status.txt
          docker run -d \
            --name webtop \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -v "$PWD/config:/config" \
            -e CUSTOM_USER=admin \
            -e PUID=$UID_NUM \
            -e PGID=$GID_NUM \
            -e PASSWORD="${{ secrets.WEBTOP_PASSWORD }}" \
            ghcr.io/linuxserver/webtop
          sleep 80
          docker exec webtop sh -c 'pgrep -x xfce4-session >/dev/null && echo "XFCE-SESSION: RUNNING" || echo "XFCE-SESSION: DEAD"' | tee -a /tmp/status.txt || true

      - name: Reinstall saved packages
        continue-on-error: true
        run: |
          if [ ! -f state/packages.txt ]; then
            echo "no package list - fresh system"
            exit 0
          fi
          grep -v '^$' state/packages.txt > /tmp/want.txt || true
          echo "replaying $(wc -l < /tmp/want.txt) explicitly-installed packages"
          docker cp /tmp/want.txt webtop:/tmp/want.txt
          docker exec webtop sh -c 'xargs apk add --no-cache < /tmp/want.txt 2>&1 | tail -5 || true'
          docker exec webtop sh -c 'cp /etc/apk/world /tmp/pkgs.txt 2>/dev/null || : > /tmp/pkgs.txt'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
          echo "PACKAGES-TOTAL: $(docker exec webtop sh -c 'wc -l < /etc/apk/world' | tr -d ' \r')" >> /tmp/status.txt

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Expose desktop and print URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "::error::no tunnel URL"; exit 1; }
          echo "$URL" > /tmp/url.txt
          tail -n +2 /tmp/status.txt >> /tmp/url.txt
          { cat /tmp/status.txt; echo "(URL withheld - see tunnel-url artifact)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/url.txt
          retention-days: 1

      - name: Email login details
        if: always()
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          WEBTOP_PASSWORD: ${{ secrets.WEBTOP_PASSWORD }}
        run: |
          URL="$(head -1 /tmp/url.txt 2>/dev/null || true)"
          {
            echo "URL=$URL"
            echo "MAIL_TO=$MAIL_TO"
            echo "MAIL_FROM=$MAIL_FROM"
            echo "KEY_PRESENT=$([ -n "$RESEND_KEY" ] && echo yes || echo no)"
            if [ -z "$RESEND_KEY" ]; then
              echo "RESULT=SKIPPED-no-key"
            else
              DOMAIN="${URL#https://}"; DOMAIN="${DOMAIN%%/*}"
              SUBJECT="Linux Desktop ready - $DOMAIN"
              PAYLOAD=$(jq -nc --arg f "$MAIL_FROM" --arg to "$MAIL_TO" --arg s "$SUBJECT" --arg u "$URL" --arg p "$WEBTOP_PASSWORD" \
                '{from:$f, to:[$to], subject:$s,
                  html:("<html><body style=\"font-family:Arial;background:#f4f5f7;padding:24px\"><div style=\"max-width:560px;margin:auto;background:#fff;border-radius:12px;overflow:hidden\"><div style=\"background:#2563eb;padding:20px;color:#fff;font-size:19px\">Linux Desktop ready</div><div style=\"padding:24px\"><p style=\"color:#666;font-size:13px;margin:0 0 6px\">URL</p><p style=\"margin:0 0 18px;font-size:15px\"><a href=\""+$u+"\">"+$u+"</a></p><p style=\"color:#666;font-size:13px;margin:0 0 6px\">Username</p><p style=\"margin:0 0 18px;font-family:monospace;font-size:16px;background:#f1f5f9;padding:8px 12px;border-radius:6px\">admin</p><p style=\"color:#666;font-size:13px;margin:0 0 6px\">Password</p><p style=\"margin:0;font-family:monospace;font-size:16px;background:#f1f5f9;padding:8px 12px;border-radius:6px\">"+$p+"</p></div></div></body></html>")}')
              CODE=$(curl -s -o /tmp/res.json -w '%{http_code}' -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_KEY" -H "Content-Type: application/json" -d "$PAYLOAD")
              echo "HTTP=$CODE"
              echo "BODY=$(head -c 400 /tmp/res.json)"
              if [ "$CODE" = "200" ]; then echo "RESULT=SENT"; else echo "RESULT=FAILED"; fi
            fi
          } > /tmp/email-status.txt
          # SECURITY: never tee this to stdout - the job log of a PUBLIC repo is
          # world-readable for completed runs, which would leak the live URL.
          grep -v '^URL=' /tmp/email-status.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload email status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-status
          path: /tmp/email-status.txt
          retention-days: 7


      - name: Save 1
        if: always()
        continue-on-error: true
        run: |
          true
          mkdir -p state
          docker exec webtop sh -c "echo 'MARKER: run-${{ github.run_id }} save-1 $(date -u +%Y%m%dT%H%M%SZ)' > /config/.session-marker" || true
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'cp /etc/apk/world /tmp/pkgs.txt 2>/dev/null || : > /tmp/pkgs.txt'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
          docker exec webtop sh -c 'ls -A /config/Desktop > /tmp/desktop.txt 2>/dev/null || true'
          docker cp webtop:/tmp/desktop.txt state/desktop.txt || true
      - uses: actions/cache/save@v4
